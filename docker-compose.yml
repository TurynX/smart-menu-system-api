services:
  postgres:
    image: postgres:17-alpine
    container_name: smart_menu_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: restaurant_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:17-alpine
    container_name: smart_menu_postgres_test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: restaurant_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql_test/data

volumes:
  postgres_data:
  postgres_test_data:
